<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscripción - Certamen de Danza</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 500px; margin: 30px auto; padding: 20px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 5px; }
    button { background: #6f42c1; color: white; border: none; padding: 12px; cursor: pointer; width: 100%; font-size: 16px; border-radius: 5px; }
    button:hover { background: #5a32a3; }
    #mensaje { margin-top: 20px; padding: 15px; display: none; border-radius: 5px; text-align: center; }
    .exito { background-color: #d4edda; color: #155724; }
    .error { background-color: #f8d7da; color: #721c24; }
  </style>
</head>
<body>

  <h2>Inscripción Certamen de Danza</h2>
  
  <form id="inscripcionForm">
    <div class="form-group">
      <label for="nombre">Nombre y Apellido:</label>
      <input type="text" id="nombre" name="nombre" required>
    </div>

    <div class="form-group">
      <label for="dni">DNI / Documento:</label>
      <input type="text" id="dni" name="dni" required>
    </div>

    <div class="form-group">
      <label for="email">Correo Electrónico:</label>
      <input type="email" id="email" name="email" required>
    </div>

    <div class="form-group">
      <label for="categoria">Categoría / Modalidad:</label>
      <input type="text" id="categoria" name="categoria" placeholder="Escribe tu categoría" required>
    </div>

    <button type="submit" id="btnEnviar">Inscribirme y Recibir QR</button>
  </form>

  <div id="mensaje"></div>

  <script>
    document.getElementById('inscripcionForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const btn = document.getElementById('btnEnviar');
      const mensajeDiv = document.getElementById('mensaje');
      btn.disabled = true;
      btn.innerText = "Procesando inscripción...";

      const datos = {
        nombre: document.getElementById('nombre').value,
        dni: document.getElementById('dni').value,
        email: document.getElementById('email').value,
        categoria: document.getElementById('categoria').value
      };

      try {
  // Esta es la línea a revisar
  const respuesta = await fetch('/api/enviar-qr', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(datos)
  });

        const resultado = await respuesta.json();

        if (respuesta.ok) {
          mensajeDiv.className = "exito";
          mensajeDiv.innerText = "¡Inscripción exitosa! Revisa tu correo electrónico, hemos enviado tu pase con código QR.";
          mensajeDiv.style.display = 'block';
          document.getElementById('inscripcionForm').reset();
        } else {
          throw new Error(resultado.error || "Ocurrió un error al procesar la inscripción.");
        }
      } catch (error) {
        mensajeDiv.className = "error";
        mensajeDiv.innerText = error.message;
        mensajeDiv.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.innerText = "Inscribirme y Recibir QR";
      }
    });
  </script>
</body>
</html>
